[db]
# Only support SQLite after v2
database = porter
prefix = pt_

# Only useful if you are migrating from v1 to v2
[db_v1]
# type: Union["sqlite", "mysql"]
type = sqlite
host = localhost
port = 3306
user = root
password = root
database = porter
prefix = pt_

[core]
# Public IP
ip = 1.1.1.1
# Network interface
interface = vmbr0
# iptables file
iptables_file = ./iptables.sh

[dev]
debug = false

[meta]
version = 0.0.1-alpha.1